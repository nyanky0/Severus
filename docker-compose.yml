services:
  db:
    image: postgres:16-alpine
    container_name: severus-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: severus_db
      POSTGRES_USER: severus_user
      POSTGRES_PASSWORD: severus_secret
    ports:
      - "5432:5432"
    volumes:
      - severus_pgdata:/var/lib/postgresql/data
    networks:
      - severus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U severus_user -d severus_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: severus-backend
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_KEY: base64:8mP9+0rF5g7aW9v8k3X4z5Y6a7b8c9d0e1f2g3h4i5j=
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: severus_db
      DB_USERNAME: severus_user
      DB_PASSWORD: severus_secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - severus-network

  frontend:
    image: nginx:alpine
    container_name: severus-frontend
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - severus-network

networks:
  severus-network:
    driver: bridge

volumes:
  severus_pgdata:
    driver: local
